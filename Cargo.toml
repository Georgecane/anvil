[package]
name = "anvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
description = "An experimental native UI runtime for the web ecosystem, without Chromium or WebView."
repository = "https://github.com/Georgecane/anvil"
readme = "README.md"

[lib]
name = "anvil"
path = "src/lib.rs"

[dependencies]
boa_engine = "0.22.0"
wgpu = "30.0.2"
winit = "0.30.13"
cosmic-text = "0.19.0"
unicode-segmentation = "1.13.3"
style = { package = "stylo", version = "0.24.0", default-features = false, features = ["servo"] }
style_dom = { package = "stylo_dom", version = "0.24.0" }
selectors = "0.43.0"
cssparser = "0.38.0"
style_traits = { package = "stylo_traits", version = "0.24.0", features = ["servo"] }
static_prefs = { package = "stylo_static_prefs", version = "0.24.0" }
app_units = "0.7.8"
euclid = "0.22.14"
url = "2.5.9"
taffy = { version = "0.16.0", default-features = false, features = ["std", "flexbox", "grid", "block_layout", "float_layout", "calc", "content_size"] }

[dev-dependencies]

[[bench]]
name = "baseline"
harness = false

[[bench]]
name = "memory"
harness = false

[[bench]]
name = "structural"
harness = false
